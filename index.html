<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="A simple, fast to-do list for today. Add, check off, delete. Works offline.">
<title>Today — to-do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #14161a;
    --muted: #6b7280;
    --faint: #9aa1ac;
    --line: #e3e6eb;
    --accent: #2f6bff;
    --accent-soft: rgba(47,107,255,.10);
    --danger: #d64545;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px -12px rgba(16,24,40,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a20;
      --text: #e9edf3;
      --muted: #98a1ae;
      --faint: #6f7885;
      --line: #262b34;
      --accent: #5b8bff;
      --accent-soft: rgba(91,139,255,.14);
      --danger: #ff6b6b;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -16px rgba(0,0,0,.7);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding:
      max(18px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }

  .app { max-width: 560px; margin: 0 auto; }

  header { padding: 8px 4px 18px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .10em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { margin: 4px 0 2px; font-size: clamp(26px, 7vw, 34px); line-height: 1.15; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }

  /* add form */
  .add {
    display: flex; gap: 8px; margin: 0 0 14px;
  }
  .add input[type="text"] {
    flex: 1 1 auto; min-width: 0;
    font: inherit; font-size: 16px; /* 16px stops iOS zoom-on-focus */
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .add input[type="text"]::placeholder { color: var(--faint); }
  .add input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .add button {
    flex: 0 0 auto;
    font: inherit; font-weight: 650; font-size: 15px;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius);
    padding: 0 20px; min-height: 52px;
    cursor: pointer; touch-action: manipulation;
    transition: transform .08s, filter .15s;
  }
  .add button:active { transform: scale(.97); }
  .add button[disabled] { opacity: .45; cursor: default; }

  /* progress */
  .meter {
    display: flex; align-items: center; gap: 10px;
    padding: 0 4px 12px; color: var(--muted); font-size: 13px;
  }
  .bar { flex: 1 1 auto; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 99px; background: var(--accent); transition: width .25s ease; }

  /* list */
  ul.list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  li.item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 6px 6px 4px;
    box-shadow: var(--shadow);
  }
  li.item.enter { animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .item.enter { animation: none; } .bar > i { transition: none; } }

  /* the whole checkbox+label is one big tap target */
  .toggle {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: flex-start; gap: 12px;
    background: none; border: 0; text-align: left;
    font: inherit; color: inherit;
    padding: 11px 10px; min-height: 48px;
    cursor: pointer; touch-action: manipulation;
    border-radius: 10px;
  }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .box {
    flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px;
    border: 2px solid var(--faint); border-radius: 7px;
    display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 13px; height: 13px; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .box svg path { stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .text {
    min-width: 0; overflow-wrap: anywhere;
    font-size: 16px; line-height: 1.45;
    transition: color .15s;
  }
  li.item.done .box { background: var(--accent); border-color: var(--accent); }
  li.item.done .box svg { opacity: 1; transform: none; }
  li.item.done .text { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  li.item.done { box-shadow: none; background: transparent; }

  .del {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px;
    color: var(--faint); cursor: pointer; touch-action: manipulation;
    transition: color .15s, background .15s;
  }
  .del:hover, .del:focus-visible { color: var(--danger); background: rgba(214,69,69,.10); outline: none; }
  .del:active { transform: scale(.92); }
  .del svg { width: 17px; height: 17px; }

  /* empty state */
  .empty { text-align: center; padding: 44px 16px 40px; color: var(--muted); }
  .empty .emoji { font-size: 34px; line-height: 1; filter: saturate(.9); }
  .empty p { margin: 12px 0 0; font-size: 15px; }
  .empty .hint { font-size: 13px; color: var(--faint); margin-top: 4px; }

  /* footer */
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 4px 0; font-size: 13px; color: var(--muted);
  }
  .ghost {
    font: inherit; font-size: 13px; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; min-height: 40px;
    cursor: pointer; touch-action: manipulation;
  }
  .ghost:hover, .ghost:focus-visible { color: var(--text); border-color: var(--faint); outline: none; }

  /* carry-over banner */
  .carry {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--accent-soft); border: 1px solid transparent;
    color: var(--text); border-radius: var(--radius);
    padding: 13px 14px; margin: 0 0 14px; font-size: 14px;
  }
  .carry span { display: block; }
  .carry .acts { display: flex; gap: 8px; }
  .carry button {
    font: inherit; font-size: 13px; font-weight: 650;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px;
    padding: 8px 14px; min-height: 38px; cursor: pointer; touch-action: manipulation;
  }
  .carry button.no { background: transparent; color: var(--muted); font-weight: 500; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow" id="eyebrow">Today</div>
    <h1 id="dateTitle">Today</h1>
    <p class="sub" id="subtitle">One small thing at a time.</p>
  </header>

  <form class="add" id="addForm" autocomplete="off" novalidate>
    <label class="sr" for="input">What do you need to do today?</label>
    <input id="input" type="text" placeholder="Add a task…" maxlength="300"
           enterkeyhint="done" autocapitalize="sentences" spellcheck="true">
    <button type="submit" id="addBtn" disabled>Add</button>
  </form>

  <div class="carry" id="carry" hidden>
    <span id="carryText"></span>
    <div class="acts">
      <button type="button" id="carryYes">Bring them over</button>
      <button type="button" class="no" id="carryNo">Discard</button>
    </div>
  </div>

  <div class="meter" id="meter" hidden>
    <div class="bar"><i id="barFill"></i></div>
    <div id="meterText">0 left</div>
  </div>

  <ul class="list" id="list" aria-label="Today's tasks"></ul>

  <div class="empty" id="empty">
    <div class="emoji">🌤️</div>
    <p>Nothing on the list yet.</p>
    <p class="hint">Add your first task above.</p>
  </div>

  <footer>
    <div id="count" aria-live="polite">0 tasks</div>
    <button class="ghost" id="clearDone" type="button" hidden>Clear done</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var KEY = "todo-today.v1";
  var $ = function (id) { return document.getElementById(id); };

  var form = $("addForm"), input = $("input"), addBtn = $("addBtn");
  var listEl = $("list"), emptyEl = $("empty"), meterEl = $("meter"), barFill = $("barFill");
  var meterText = $("meterText"), countEl = $("count"), clearDoneBtn = $("clearDone");
  var carryEl = $("carry"), carryText = $("carryText");

  // ---- date helpers (local time, not UTC) ----
  function todayKey(d) {
    d = d || new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function prettyDate(d) {
    d = d || new Date();
    try {
      return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    } catch (e) {
      return todayKey(d);
    }
  }

  var TODAY = todayKey();
  var state = { date: TODAY, items: [] };

  // ---- storage ----
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) return { saved: null, items: [] };
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return { saved: null, items: [] }; }
    if (!parsed || !Array.isArray(parsed.items)) return { saved: null, items: [] };

    var items = parsed.items
      .filter(function (it) { return it && typeof it.text === "string" && it.text.trim() !== ""; })
      .map(function (it) {
        return {
          id: String(it.id || uid()),
          text: String(it.text).slice(0, 300),
          done: !!it.done,
          ts: Number(it.ts) || Date.now()
        };
      });
    return { saved: typeof parsed.date === "string" ? parsed.date : null, items: items };
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ date: state.date, items: state.items }));
    } catch (e) { /* private mode / quota — keep going in memory */ }
  }

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---- migrate yesterday's leftovers instead of silently dropping them ----
  var pendingCarry = [];

  function boot() {
    var loaded = load();
    if (loaded.saved && loaded.saved !== TODAY) {
      // a new day: keep only what was unfinished, offered as an explicit choice
      pendingCarry = loaded.items.filter(function (it) { return !it.done; });
      state = { date: TODAY, items: [] };
      if (pendingCarry.length) {
        carryText.textContent = pendingCarry.length + (pendingCarry.length === 1
          ? " unfinished task from " : " unfinished tasks from ") + prettyDate(new Date(loaded.saved + "T12:00:00"));
        carryEl.hidden = false;
        save();
      }
    } else {
      state = { date: TODAY, items: loaded.items };
    }
    $("eyebrow").textContent = prettyDate().split(",")[0];
    $("dateTitle").textContent = prettyDate();
    // items restored from storage are already known: no entry animation on load
    state.items.forEach(function (it) { renderedOnce[it.id] = true; });
    render();
  }

  $("carryYes").addEventListener("click", function () {
    pendingCarry.forEach(function (it) {
      state.items.push({ id: uid(), text: it.text, done: false, ts: Date.now() });
    });
    pendingCarry = [];
    carryEl.hidden = true;
    save();
    render();
    input.focus({ preventScroll: true });
  });

  $("carryNo").addEventListener("click", function () {
    pendingCarry = [];
    carryEl.hidden = true;
  });

  // ---- actions ----
  function clean(s) {
    return String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  }

  function addTask(raw) {
    var text = clean(raw);
    if (!text) return false;            // blank / whitespace-only is ignored
    state.items.push({ id: uid(), text: text.slice(0, 300), done: false, ts: Date.now() });
    save();
    render();
    return true;
  }

  function toggle(id) {
    var it = find(id);
    if (!it) return;
    it.done = !it.done;
    save();
    render();
  }

  function remove(id) {
    state.items = state.items.filter(function (it) { return it.id !== id; });
    save();
    render();
  }

  function find(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }

  // ---- render ----
  var renderedOnce = Object.create(null);   // ids already painted; only new ones animate

  function render() {
    var total = state.items.length;
    var left = state.items.filter(function (it) { return !it.done; }).length;
    var done = total - left;

    listEl.textContent = "";
    state.items.forEach(function (it) {
      listEl.appendChild(row(it, !renderedOnce[it.id]));
      renderedOnce[it.id] = true;
    });

    emptyEl.style.display = total === 0 ? "" : "none";
    meterEl.hidden = total === 0;
    clearDoneBtn.hidden = done === 0;

    barFill.style.width = total ? Math.round((done / total) * 100) + "%" : "0%";
    meterText.textContent = total
      ? (left === 0 ? "All done 🎉" : left + " left · " + done + "/" + total + " done")
      : "";

    countEl.textContent = total === 0
      ? "No tasks yet"
      : left + (left === 1 ? " task remaining" : " tasks remaining") + " · " + total + " total";

    addBtn.disabled = clean(input.value) === "";
  }

  function row(it, animate) {
    var li = document.createElement("li");
    li.className = "item" + (it.done ? " done" : "") + (animate ? " enter" : "");
    li.dataset.id = it.id;

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "toggle";
    btn.setAttribute("role", "checkbox");
    btn.setAttribute("aria-checked", it.done ? "true" : "false");
    btn.setAttribute("aria-label", (it.done ? "Mark not done: " : "Mark done: ") + it.text);

    var box = document.createElement("span");
    box.className = "box";
    box.setAttribute("aria-hidden", "true");
    box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';

    var span = document.createElement("span");
    span.className = "text";
    span.textContent = it.text;   // textContent => no HTML injection

    btn.appendChild(box);
    btn.appendChild(span);
    btn.addEventListener("click", function () { toggle(it.id); });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.setAttribute("aria-label", "Delete: " + it.text);
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.addEventListener("click", function () { remove(it.id); });

    li.appendChild(btn);
    li.appendChild(del);
    return li;
  }

  // ---- events ----
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (addTask(input.value)) {
      input.value = "";
      render();
      input.focus({ preventScroll: true });
    } else {
      input.value = "";
      render();
    }
  });

  input.addEventListener("input", function () {
    addBtn.disabled = clean(input.value) === "";
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  clearDoneBtn.addEventListener("click", function () {
    state.items = state.items.filter(function (it) { return !it.done; });
    save();
    render();
  });

  // keep multiple tabs in sync
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var loaded = load();
    if (loaded.saved === state.date) {
      state.items = loaded.items;
      render();
    }
  });

  // if the tab is left open past midnight, roll to the new day on return
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (todayKey() !== TODAY) location.reload();
  });

  boot();
})();
</script>
</body>
</html>
